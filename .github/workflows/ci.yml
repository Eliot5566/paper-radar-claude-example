name: Validate example
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install paper-radar==0.2.0
      - name: Validate the real configuration without a key
        run: paper-radar check -c radar.toml
      - name: Render the fictional offline demo
        run: |
          paper-radar demo --out demo
          test -s demo/site/index.html
